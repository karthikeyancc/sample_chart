name: Build and Deploy to GitHub Pages
on:
  push:
    branches:
      - main
      - master
  pull_request:        # optional: run on PRs too so CI checks before merge
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # ensures full history, latest code
          persist-credentials: true

      - name: Setup Node.js (use Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'             # built-in caching for node modules

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:github

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/echarts-tabulator

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1