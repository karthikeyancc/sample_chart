name: Build and Deploy to GitHub Pages
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js (use Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:github

      - name: Verify build output
        run: |
          echo "Working directory: $(pwd)"
          echo "Dist top-level:"
          ls -la dist || true
          echo "Dist/echarts-tabulator listing:"
          ls -la dist/echarts-tabulator || true
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_SHA=${GITHUB_SHA}"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/echarts-tabulator

      - name: "Debug: list artifacts for this run (verify upload)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Querying artifacts for run id: $GITHUB_RUN_ID"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | python -m json.tool || true

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
